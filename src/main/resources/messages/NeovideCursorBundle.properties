# ==================== tags / preset scope ====================
settings.tag.global=<font color="#6C8EBF"><b>[Global]</b></font>
settings.tag.color=<font color="#C08A3E"><b>[Color preset]</b></font>
settings.comment.presetScopeHint=<b>Which settings follow presets?</b><br/>- <b>Unlabelled items</b> follow the animation preset: changing any of them automatically creates an "XX copy", and switching presets returns to that preset's values.<br/>- <font color="#6C8EBF"><b>[Global]</b></font> never changes when switching presets: master switch, hide native caret, always refresh, target frame rate, multi-caret glow, caret width/height, input smoothing, render mode, diagnostic log.<br/>- <font color="#C08A3E"><b>[Color preset]</b></font> is controlled by the "Color preset" dropdown above; animation presets never touch it: trail color, glow color, caret gradient.

# ==================== comments ====================
settings.comment.alwaysHighFps=Refreshes every 8 ms, so the caret follows as closely as possible, but it keeps using CPU. Turn it off on a slow machine or on battery: the cost is a one-beat delay on the first move after idling.
settings.comment.hideNative=Only the trail cursor is shown.<b>Note</b>: this changes the IDE color scheme and is persisted. After uninstalling the plugin the native caret may still be hidden; untick this box to restore it.
settings.comment.coupling=Tip: when "Hide native caret" is on, also turn on "Always refresh"; otherwise following will lag.
settings.comment.targetFps=Only takes effect when "Always refresh" is on. <b>125</b> is the stable setting; <b>144</b> suits 144 Hz and faster displays and is measured to hit its target. <br/>Higher values (165/240) are limited by the OS sleep timer and measured less accurate, so they are not offered.
settings.comment.slope=How far the quad <b>tilts</b> while typing on one line. <br/><b>0% = pure rectangle</b>: it only stretches vertically and the left/right edges stay vertical, with no tilt (<b>stretching still happens</b>; this does not disable deformation). <br/><b>100% = fully slanted</b>: the value derived from "Stretch strength", i.e. the original upstream effect. <br/><b>Follows presets</b>: changing it automatically creates a copy; switching presets returns to that preset's value. <br/>Note that "Input smoothing" flattens the tilt: with more smoothing the slope also looks smaller.
settings.comment.glowLayers=More layers look smoother, but every layer costs CPU drawing; lower it on a slow machine. The layer count does not affect brightness.
settings.comment.shadowBlur=Smaller values spread the halo out (like fog); larger values tighten it against the caret edge. <b>The most spread setting noticeably increases repaint cost</b>; a slow machine may drop frames. The default of 73 is a good middle ground. <br/>The preview window is tiny, so <b>the same spread looks much larger in the preview than in the editor</b>; judge the real look in the editor.
settings.comment.stretch=<b>Only affects typing/backspace on one line</b>: the higher it is, the slower the trailing edge and the longer the stretch. <br/><b>It has no effect on line breaks</b>; the cross-line ribbon is controlled by "Trail density" and "Cross-line animation length". <br/>It is also offset by "Input smoothing": once smoothing flattens the corner speed difference, the stretch effect weakens. With both set high the result may look flatter.
settings.comment.fadeOff=These two values have no effect while fade-out is off: the glow disappears at once. This group fades <b>the glow layer only</b>; the caret itself stays opaque. <br/><b>Not applicable in the "Afterimage" rendering mode</b> (afterimages fade on their own schedule).
settings.comment.animLen=How long the trail lasts when moving to another line. Too long and you see "the previous position still trailing"; 0.1~0.2 s is recommended.
settings.comment.shortLen=How long the trail lasts while typing/backspace. <b>Below 0.04 s the trail is invisible</b> (too fast); 0.08~0.15 s is recommended.
settings.comment.animCoupling=These items only affect duration; for the stretch multiplier see "Ribbon stretch strength" above.
settings.comment.trailSize=<b>Controls the difference between the two ends of the cross-line ribbon</b>. 1.0 = the leading edge <b>reaches the new position on the first frame</b> and only the trailing edge drags out (most ribbon-like); lower values make the leading edge drag too, and 0 = both ends move at the same speed with no ribbon. <br/>So this item only affects line breaks; typing within a line is controlled by "Stretch strength". <br/>Note: the leading edge needs at least 1 frame (about 8 ms); it cannot truly be 0, that is the repaint frame-rate floor.
settings.comment.animLenExtra=<b>It decides the ribbon length together with "Trail density"</b>: trailing edge = this value, leading edge = this value x (1 - trail density). So with trail density 1.0 the leading edge is 0 (instant).
settings.comment.typingSmooth=Flattens the corner speed difference a little to make typing feel more continuous. <b>0% = unchanged, 100% = flattest</b>. <br/><b>It offsets "Stretch strength"</b>: both adjust how fast the four corners differ, so raising stretch and smoothing at the same time may cancel out almost completely. <br/>Only affects one line; the cross-line ribbon is unaffected (it is controlled by "Trail density" and "Cross-line animation length"). <br/><b>Note: the higher it is, the more the trail lags behind fast continuous typing on one line.</b>
settings.comment.paintDiag=Skips drawing and only runs the computation, to tell whether a stutter comes from "slow drawing" or "slow scheduling". Turns itself off after a restart.
settings.comment.cursorGradient=The caret itself has <b>a same-hue light-to-dark change from top to bottom</b>: the top is the trail color you chose, the bottom is a darker version derived from the <b>glow color</b>. <br/>So changing the trail or glow color changes this gradient too; it is always two levels of one hue. <br/><b>When off it is a solid fill</b>, with no gradient. <br/><b>Mutually exclusive with the "Rainbow (dynamic)" color preset</b>: when that preset is selected the hue cycles and this item has no effect. <br/>The glow's own color is not affected by this item; it always uses "Glow color".
settings.comment.multiCursorNoGlow=With 2 or more carets the glow layer count is forced to zero, leaving only the trail stretch shape to reduce drawing cost with multiple carets. A single caret is unaffected.
settings.comment.leadingSnap=<b>Not implemented yet: this feature is not available, and ticking it will not change the look.</b> <br/>The switch state is saved for when it is implemented. <br/><b>Does not follow animation presets</b>: switching presets does not change it. <br/><b>Greyed out in afterimage mode</b>.
settings.comment.crossShapeExperiment=<b>Device-level experiment, default off, and does not follow animation presets.</b><br/>When on, it takes over only large cross-line / mouse-drag paths; single-line typing, slope, stretch, smoothing, glow, colors and fade are unchanged.<br/><b>"Trail density" no longer adjusts that path and is greyed out; its value is kept, not cleared.</b><br/>Greyed out in afterimage mode.
settings.comment.cursorWidth=1~5 pixels; 5 = the IDE thick-caret width (the upper limit). This width is kept while the caret is idle.
settings.comment.cursorHeight=100% = full line height (fills the line); 30% = three tenths (centered). The maximum is full height and cannot be exceeded.
settings.comment.renderModeWarning=⚠ Warning: afterimage mode (AFTERIMAGE) is experimental and <b>not recommended for daily use</b>: it records real past positions, so the afterimages thin out when frames drop; and it currently <b>follows only the main caret</b>, so with multiple carets only the main one has afterimages. Unless you explicitly need it in a low-FPS environment, keep "Spring (stretch)" mode.
settings.comment.diagLogging=When ticked, writes one caret state line (caret / block / draw) to idea.log every 15 frames. After reproducing a problem, send idea.log to the developer; leaving it on for a long time grows the log.

