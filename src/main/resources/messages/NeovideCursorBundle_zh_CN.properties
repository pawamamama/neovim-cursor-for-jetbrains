settings.tag.global=<font color="#6C8EBF"><b>[全局]</b></font>
settings.tag.color=<font color="#C08A3E"><b>[颜色预设]</b></font>
settings.comment.presetScopeHint=<b>哪些设置随预设变？</b><br/>· <b>没标注的</b>都随动画预设：改任一项会自动生成一个「XX 副本」，切预设回到该预设的值。<br/>· <font color="#6C8EBF"><b>[全局]</b></font> 切任何预设都不变：总开关、隐藏原生光标、常驻刷新、目标帧率、多光标辉光、光标宽/高、输入平滑、渲染模式、诊断日志。<br/>· <font color="#C08A3E"><b>[颜色预设]</b></font> 由上面「颜色预设」下拉控制，动画预设不碰：拖尾颜色、辉光颜色、光标渐变。

# ==================== 说明 ====================
settings.comment.alwaysHighFps=常驻按 8ms 刷新，光标跟随最跟手，但会一直占 CPU。机器卡或笔记本省电时可以关掉 —— 代价是停手后第一次操作会慢一拍。
settings.comment.hideNative=勾选后只显示拖尾光标。<b>注意</b>：它改的是 IDE 配色方案且会落盘，卸载插件后原生光标可能仍是隐形的 —— 届时从本页取消勾选即可恢复。
settings.comment.coupling=提示：勾选「隐藏原生光标」时建议同时开「常驻刷新」，否则跟随会有延迟。
settings.comment.targetFps=只在开启「常驻刷新」时生效。<b>125</b> 是稳定档；<b>144</b> 适合 144Hz 以上显示器，实测能精准达成。<br/>再往上（165/240）受系统睡眠精度限制，实测反而更不准，所以不提供。
settings.comment.slope=单行打字时四边形的<b>倾斜程度</b>。<br/><b>0% = 纯矩形</b>：只上下伸缩、左右边缘垂直，完全没有倾斜（<b>拉伸仍然存在</b>，不是取消形变）。<br/><b>100% = 完全斜</b>：等于「拉伸强度」推导出的原值，也就是上游原版效果。<br/><b>本项随预设变化</b>：改了它会自动生成副本，切预设回到该预设的值。<br/>注意「输入平滑」会把倾斜压平：平滑开大时斜度也会显得更小。
settings.comment.glowLayers=越多越平滑，但每层都要 CPU 绘制，机器慢时建议调低。层数不影响亮度。
settings.comment.shadowBlur=数值越小光晕越散（像雾），越大越收紧（贴近光标边缘）。<b>调到最散会明显增加重绘开销</b>，慢机器可能掉帧。默认 73 比较适中。<br/>预览窗很小，<b>同样的外扩量在预览里会显得比编辑器里大得多</b>，判断实际观感请以编辑器为准。
settings.comment.stretch=<b>只影响单行打字/退格</b>：越大后缘越慢、拉得越长。<br/><b>调它对换行没有影响</b> —— 跨行缎带由「拖尾密度」和「跨行动画时长」决定。<br/>另外它会被「输入平滑」抵消：平滑把四角速度差压平后，拉伸强度的效果会变弱。两者都调高时，观感可能反而更「平」。
settings.comment.fadeOff=淡出关闭时这两个值不生效：辉光会立即消失。本组只淡<b>辉光层</b>，光标本体始终不透明。<br/><b>「残影」渲染模式下不适用</b>（残影有自己的淡出节奏）。
settings.comment.animLen=换行时拖尾持续多久。太长会看到「上一个位置还在拖」，建议 0.1~0.2s。
settings.comment.shortLen=打字/退格时拖尾持续多久。<b>低于 0.04s 会看不出拖尾</b>（太快了），建议 0.08~0.15s。
settings.comment.animCoupling=这几项只影响时长，拉伸倍率见上方「缎带拉伸强度」。
settings.comment.trailSize=<b>控制跨行缎带的两端差异</b>。1.0 = 前缘在<b>第一帧就到新位置</b>、只有后缘慢慢拖出去（最像缎带）；调小则前缘也开始拖，0 = 前后缘等速、缎带消失。<br/>所以本项只决定跨行；行内打字由「拉伸强度」决定。<br/>注：前缘最快也要 1 帧（约 8ms），不可能真的 0 —— 那是绘制帧率的下限。
settings.comment.animLenExtra=<b>它和「拖尾密度」一起决定缎带长度</b>：后缘 = 本值，前缘 = 本值 ×（1 − 拖尾密度）。所以拖尾密度为 1.0 时前缘是 0（瞬间到位）。
settings.comment.typingSmooth=把四角速度差压平一点，让打字更连贯。<b>0% 原样，100% 最平</b>。<br/><b>它与「拉伸强度」互相抵消</b>：两者都在调四角的快慢差，所以把拉伸强度调高、同时又把本项开大，净效果可能几乎看不出来。<br/>只影响单行；跨行缎带不受本项影响（由「拖尾密度」和「跨行动画时长」决定）。<br/><b>注意：开得越大，单行连续快速输入时拖尾会跟不上。</b>
settings.comment.paintDiag=跳过绘制只跑计算，用于判断卡顿是「画得慢」还是「调度慢」。重启后自动关闭。
settings.comment.cursorGradient=光标本身<b>从上到下有个同色系的深浅变化</b>：上端 = 你选的拖尾颜色，下端 = 从<b>辉光颜色</b>自动算出的更深版本。<br/>所以换了拖尾色或辉光色，这个渐变会跟着变，始终是同一色系的两个层次。<br/><b>关闭时是纯色填充</b>，没有渐变。<br/><b>与「彩虹（动态）」颜色预设互斥</b>：选了彩虹预设时走色相循环，本项不生效。<br/>辉光本身的颜色不受本项影响 —— 它始终用「辉光颜色」那一项。
settings.comment.multiCursorNoGlow=光标 ≥ 2 个时把辉光层数强制归零，只保留拖尾拉伸形状 —— 减少多光标时的绘制开销。单光标不受影响。
settings.comment.leadingSnap=<b>待实现：此功能尚未实现，勾选不会改变观感。</b><br/>开关状态会被保存，供实现后使用。<br/><b>不随动画预设变化</b>：切任何预设都不改本项。<br/><b>残影模式下置灰</b>。
settings.comment.crossShapeExperiment=<b>设备级实验开关，默认关，不随动画预设变化。</b><br/>开启后只接管「跨行 / 鼠标拖动」的大跨度路径；单行打字、斜度、拉伸、平滑、辉光、颜色、淡出不变。<br/><b>「拖尾密度」不再调节该路径并置灰；它的值会保留，不会清空。</b><br/>残影模式下置灰。
settings.comment.cursorWidth=1~5 像素，5 = IDEA 粗光标宽度（上限）。静止时也保持这个宽度。
settings.comment.cursorHeight=100% = 顶格（占满行高）；30% = 只占三成（居中）。上限就是顶格，不能超过。
settings.comment.renderModeWarning=⚠ 残影模式（AFTERIMAGE）为实验性功能，<b>官方不建议日常使用</b>：它记录真实历史位置，掉帧时残影会变稀疏；且当前<b>只跟随主光标</b>，多光标下只有主光标有残影。除非你在低帧率环境明确需要它，否则请保持「弹簧（拉伸）」模式。
settings.comment.diagLogging=勾选后每 15 帧往 idea.log 写一条光标状态（caret / block / draw）。复现问题后把 idea.log 发给开发者；长期开着会撑大日志。

